name: Preview no GitHub Pages

# Por enquanto este repositório é o PREVIEW: publica com os imóveis de exemplo (MODO=demo, noindex)
# em raphaelpiotto23-source.github.io/wisekey-imoveis/. A produção em imoveis.wisekey.co vem depois.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro build
        env:
          MODO: demo
          BASE: /wisekey-imoveis
          SITE: https://raphaelpiotto23-source.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
